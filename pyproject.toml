[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-harness"
version = "0.1.0"
description = "Planner-generator-evaluator harness for long-running ESG product development."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
esg-harness = "esg_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
