<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceLight Store Workspace</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="store" data-route-prefix="..">
    <div class="app-shell app-shell-store">
      <header class="app-header">
        <a id="brand-link" class="brand" href="../">TraceLight</a>
        <div class="header-controls">
          <label class="field-label" for="tenant-select" data-i18n="common.tenant">Tenant</label>
          <select id="tenant-select" class="tenant-select"></select>
          <div class="language-switcher" id="language-switcher"></div>
        </div>
      </header>

      <nav class="role-nav" id="role-nav"></nav>

      <main class="page-stack page-stack-store">
        <section class="page-intro page-intro-store">
          <p class="eyebrow" data-i18n="store.intro.eyebrow">Store manager</p>
          <h1 data-i18n="store.intro.title">Capture today&apos;s material evidence.</h1>
          <p class="lede" id="tenant-note"></p>
        </section>

        <section class="store-quick-grid" id="store-quick-grid"></section>

        <section class="panel store-status-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow" data-i18n="store.status.eyebrow">Capture status</p>
                <h2 id="connection-state">Online and ready</h2>
              </div>
              <button id="connection-toggle" class="secondary-button" type="button">Work offline</button>
          </div>
          <p class="lede store-status-copy" id="connection-copy"></p>
          <div class="queue-actions">
            <span class="inline-pill" id="queue-pill">0 queued</span>
            <button id="sync-queue-button" class="secondary-button" type="button">Sync queued uploads</button>
          </div>
        </section>

        <section class="store-mobile-layout">
          <article class="panel panel-form">
            <div class="panel-head">
              <div>
                <p class="eyebrow" data-i18n="store.new.eyebrow">New upload</p>
                <h2 id="store-name">Store capture</h2>
              </div>
              <span class="inline-pill" data-i18n="store.form.mobile_ready">Mobile ready</span>
            </div>

            <form id="store-form" class="capture-form">
              <label>
                <span data-i18n="store.form.photo">Photo evidence</span>
                <input
                  id="photo-input"
                  name="photo"
                  type="file"
                  accept="image/*"
                  capture="environment"
                />
              </label>

              <label>
                <span data-i18n="store.form.material">Material type</span>
                <select name="materialType" required></select>
              </label>

              <label>
                <span data-i18n="store.form.weight">Weight (kg)</span>
                <input
                  name="weightKg"
                  type="number"
                  min="0"
                  step="0.1"
                  value="18.4"
                  required
                />
              </label>

              <label>
                <span data-i18n="store.form.zone">Store zone</span>
                <input
                  name="zone"
                  type="text"
                  placeholder="Backroom recycling bay"
                  data-i18n-placeholder="store.form.zone_placeholder"
                  required
                />
              </label>

              <label>
                <span data-i18n="store.form.notes">Notes</span>
                <textarea
                  name="notes"
                  rows="4"
                  placeholder="Add contamination, supplier, or handling notes"
                  data-i18n-placeholder="store.form.notes_placeholder"
                ></textarea>
              </label>

              <div class="sticky-submit-bar">
                <div class="sticky-copy">
                  <strong id="submit-state-label">Ready to upload</strong>
                  <span id="submit-state-copy">Online sync available now.</span>
                </div>
                <button id="store-submit-button" type="submit" class="primary-button">Upload evidence</button>
              </div>
            </form>
          </article>

          <article class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow" data-i18n="store.recent.eyebrow">Recent uploads</p>
                <h2 data-i18n="store.recent.title">What you already sent</h2>
              </div>
            </div>
            <div id="evidence-list" class="simple-list media-list"></div>
          </article>

          <article class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow" data-i18n="store.queue.eyebrow">Queued uploads</p>
                <h2 data-i18n="store.queue.title">Waiting to sync</h2>
              </div>
            </div>
            <div id="queue-list" class="simple-list"></div>
          </article>
        </section>
      </main>
    </div>

    <script src="../app.js"></script>
  </body>
</html>
