<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceLight Executive Workspace</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="executive" data-route-prefix="..">
    <div class="app-shell">
      <header class="app-header">
        <a id="brand-link" class="brand" href="../">TraceLight</a>
        <div class="header-controls">
          <label class="field-label" for="tenant-select" data-i18n="common.tenant">Tenant</label>
          <select id="tenant-select" class="tenant-select"></select>
          <div class="language-switcher" id="language-switcher"></div>
        </div>
      </header>

      <nav class="role-nav" id="role-nav"></nav>

      <main class="page-stack">
        <section class="page-intro">
          <p class="eyebrow" data-i18n="executive.intro.eyebrow">Executive</p>
          <h1 data-i18n="executive.intro.title">Track footprint, supplier exposure, and supporting proof.</h1>
          <p class="lede" id="tenant-note"></p>
        </section>

        <section class="kpi-grid" id="executive-kpis"></section>

        <section class="executive-layout">
          <article class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow" data-i18n="executive.ranking.eyebrow">Supplier ranking</p>
                <h2 data-i18n="executive.ranking.title">Top emitting components</h2>
              </div>
            </div>
            <div id="supplier-list" class="simple-list"></div>
          </article>

          <article class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow" data-i18n="executive.detail.eyebrow">Supplier detail</p>
                <h2 id="detail-title">Choose a supplier</h2>
              </div>
            </div>
            <div id="detail-panel" class="detail-stack"></div>
          </article>
        </section>
      </main>
    </div>

    <script src="../app.js"></script>
  </body>
</html>
