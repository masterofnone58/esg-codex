<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceLight ESG Admin Workspace</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="admin" data-route-prefix="..">
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="../">TraceLight</a>
        <div class="header-controls">
          <label class="field-label" for="tenant-select">Tenant</label>
          <select id="tenant-select" class="tenant-select"></select>
        </div>
      </header>

      <nav class="role-nav" id="role-nav"></nav>

      <main class="page-stack">
        <section class="page-intro">
          <p class="eyebrow">ESG administrator</p>
          <h1>Review incoming data and prepare disclosure output.</h1>
          <p class="lede" id="tenant-note"></p>
        </section>

        <section class="kpi-grid" id="metric-grid"></section>

        <section class="admin-layout">
          <article class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Review queue</p>
                <h2>What needs attention</h2>
              </div>
            </div>
            <div id="review-list" class="simple-list"></div>
          </article>

          <article class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Logistics</p>
                <h2>Log transport records</h2>
              </div>
            </div>

            <form id="logistics-form" class="logistics-form">
              <label>
                <span>Lane</span>
                <input
                  name="lane"
                  type="text"
                  value="Shenzhen DC to Hong Kong stores"
                  required
                />
              </label>

              <label>
                <span>Transport mode</span>
                <select name="mode">
                  <option value="Electric van">Electric van</option>
                  <option value="Diesel truck">Diesel truck</option>
                  <option value="Ocean freight">Ocean freight</option>
                  <option value="Air freight">Air freight</option>
                </select>
              </label>

              <label>
                <span>Distance (km)</span>
                <input name="distanceKm" type="number" min="0" value="42" required />
              </label>

              <label>
                <span>Load (kg)</span>
                <input name="loadKg" type="number" min="0" value="720" required />
              </label>

              <button type="submit" class="secondary-button">Add record</button>
            </form>

            <div id="logistics-list" class="simple-list table-list"></div>
          </article>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Draft report</p>
              <h2>Compliance narrative</h2>
            </div>
            <button id="generate-report" class="primary-button">Generate draft</button>
          </div>
          <div id="report-output" class="report-output"></div>
        </section>
      </main>
    </div>

    <script src="../app.js"></script>
  </body>
</html>
