<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceLight ESG Admin Workspace</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="admin" data-route-prefix="..">
    <div class="app-shell">
      <header class="app-header">
        <a id="brand-link" class="brand" href="../">TraceLight</a>
        <div class="header-controls">
          <label class="field-label" for="tenant-select" data-i18n="common.tenant">Tenant</label>
          <select id="tenant-select" class="tenant-select"></select>
          <div class="language-switcher" id="language-switcher"></div>
        </div>
      </header>

      <nav class="role-nav" id="role-nav"></nav>

      <main class="page-stack">
        <section class="page-intro">
          <p class="eyebrow" data-i18n="admin.intro.eyebrow">ESG administrator</p>
          <h1 data-i18n="admin.intro.title">Review incoming data and prepare disclosure output.</h1>
          <p class="lede" id="tenant-note"></p>
        </section>

        <section class="kpi-grid" id="metric-grid"></section>

        <section class="admin-layout">
          <article class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow" data-i18n="admin.review.eyebrow">Review queue</p>
                <h2 data-i18n="admin.review.title">What needs attention</h2>
              </div>
            </div>
            <div id="review-list" class="simple-list"></div>
          </article>

          <article class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow" data-i18n="admin.logistics.eyebrow">Logistics</p>
                <h2 data-i18n="admin.logistics.title">Log transport records</h2>
              </div>
            </div>

            <form id="logistics-form" class="logistics-form">
              <label>
                <span data-i18n="admin.logistics.lane">Lane</span>
                <input
                  name="lane"
                  type="text"
                  placeholder="Shenzhen DC to Hong Kong stores"
                  data-i18n-placeholder="admin.logistics.lane_placeholder"
                  required
                />
              </label>

              <label>
                <span data-i18n="admin.logistics.mode">Transport mode</span>
                <select name="mode"></select>
              </label>

              <label>
                <span data-i18n="admin.logistics.distance">Distance (km)</span>
                <input name="distanceKm" type="number" min="0" value="42" required />
              </label>

              <label>
                <span data-i18n="admin.logistics.load">Load (kg)</span>
                <input name="loadKg" type="number" min="0" value="720" required />
              </label>

              <button type="submit" class="secondary-button" data-i18n="admin.logistics.add_record">Add record</button>
            </form>

            <div id="logistics-list" class="simple-list table-list"></div>
          </article>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow" data-i18n="admin.report.eyebrow">Draft report</p>
              <h2 data-i18n="admin.report.title">Compliance narrative</h2>
            </div>
            <button id="generate-report" class="primary-button" data-i18n="admin.report.generate">Generate draft</button>
          </div>
          <div id="report-output" class="report-output"></div>
        </section>
      </main>
    </div>

    <script src="../app.js"></script>
  </body>
</html>
