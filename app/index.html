<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceLight ESG Cloud</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="home" data-route-prefix=".">
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="./">TraceLight</a>
        <div class="header-controls">
          <label class="field-label" for="tenant-select">Tenant</label>
          <select id="tenant-select" class="tenant-select"></select>
        </div>
      </header>

      <nav class="role-nav" id="role-nav"></nav>

      <main class="page-stack">
        <section class="page-intro">
          <p class="eyebrow">ESG SaaS MVP</p>
          <h1>Choose the right workspace for the job.</h1>
          <p class="lede" id="tenant-note"></p>
        </section>

        <section class="role-card-grid" id="role-card-grid"></section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
